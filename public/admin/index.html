<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Add material</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="wrap"><h1>Add new material</h1>
<form id="f" class="form">
  <label>Password<input type="password" id="pw" required autocomplete="current-password"></label>
  <label>Section<select id="section" required></select></label>
  <label>English title<input id="en" placeholder="Tentheno"></label>
  <label>Arabic or Coptic title<input id="ar" dir="auto" placeholder="تين ثينو"></label>
  <label>File (PDF, MP3, M4A or image, up to 24 MB)<input type="file" id="file" required accept=".pdf,.mp3,.m4a,.png,.jpg,.jpeg"></label>
  <fieldset><legend>Extra link (optional), such as a Google Drive recording</legend>
    <input id="lbl" placeholder="Label, e.g. Recording"><input id="url" type="url" placeholder="https://drive.google.com/…"></fieldset>
  <button id="go">Upload</button><p id="msg" role="status"></p>
</form></main>
<script>
const $ = id => document.getElementById(id);
$('pw').value = localStorage.getItem('hymnsPw') || '';
fetch('/sections.json').then(r => r.json()).then(l => l.forEach(s => $('section').add(new Option(s.label, s.path))));
$('f').onsubmit = async e => {
  e.preventDefault();
  $('go').disabled = true; $('msg').textContent = 'Uploading…';
  const fd = new FormData();
  fd.set('password', $('pw').value); fd.set('section', $('section').value);
  fd.set('title_en', $('en').value); fd.set('title_ar', $('ar').value);
  fd.set('file', $('file').files[0]); fd.set('link_label', $('lbl').value); fd.set('link_url', $('url').value);
  try {
    const r = await fetch('/api/upload', { method: 'POST', body: fd });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Upload failed (' + r.status + ')');
    localStorage.setItem('hymnsPw', $('pw').value);
    $('msg').textContent = 'Uploaded. The site updates in about a minute.';
    ['en', 'ar', 'file', 'lbl', 'url'].forEach(id => $(id).value = '');
  } catch (err) { $('msg').textContent = err.message; }
  $('go').disabled = false;
};
</script></body></html>
